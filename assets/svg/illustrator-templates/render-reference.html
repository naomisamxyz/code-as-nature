<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Frame reference renderer</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    img {
      display: block;
    }
  </style>
</head>
<body>
  <img id="frame" alt="">
  <script>
    const variant = new URLSearchParams(location.search).get("frame") || "1";
    const sizes = {
      1: [967.2, 312],
      3: [1101.12, 600],
      4: [1116, 636]
    };
    const size = sizes[variant] || sizes[1];
    const frame = document.querySelector("#frame");
    frame.src = `../frame${variant}.svg?v=24`;
    frame.style.width = `${size[0]}px`;
    frame.style.height = `${size[1]}px`;
  </script>
</body>
</html>
